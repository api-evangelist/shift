name: Shift Technology
description: >-
  Shift Technology is a Paris-founded InsurTech company delivering AI-native
  decisioning and automation for the global insurance industry. Its purpose-built
  AI agents automate core insurance workflows — claims coverage and liability,
  fraud and risk detection, subrogation, injury evaluation, payment integrity,
  and process orchestration — for property & casualty and health insurers. Shift
  serves 120+ insurers across 30+ countries, including 100% of the top five U.S.
  P&C carriers, and has analyzed more than four billion policies, claims, and
  documents covering 350M+ policyholders. The company also operates the Insurance
  Data Network (IDN). Shift is a General Catalyst portfolio company; it markets an
  enterprise, contact-sales product and does not publish a public developer
  portal, API reference, or SDKs.
